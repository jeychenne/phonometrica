<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="barGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)"/>

  <!-- Grid -->
  <g opacity="0.12" stroke="white" stroke-width="1">
    <path d="M64 128H448M64 256H448M64 384H448"/>
    <path d="M128 64V448M256 64V448M384 64V448"/>
  </g>

  <!-- Spectrogram bars -->
  <g>
    <rect x="90"  y="200" width="16" height="160" fill="url(#barGradient)" opacity="0.7"/>
    <rect x="120" y="170" width="16" height="190" fill="url(#barGradient)" opacity="0.85"/>
    <rect x="150" y="150" width="16" height="210" fill="url(#barGradient)" opacity="0.95"/>
    <rect x="180" y="180" width="16" height="180" fill="url(#barGradient)" opacity="0.75"/>
    <rect x="210" y="140" width="16" height="220" fill="url(#barGradient)" opacity="0.9"/>
    <rect x="240" y="160" width="16" height="200" fill="url(#barGradient)" opacity="0.8"/>
    <rect x="270" y="190" width="16" height="170" fill="url(#barGradient)" opacity="0.7"/>
    <rect x="300" y="150" width="16" height="210" fill="url(#barGradient)" opacity="0.95"/>
    <rect x="330" y="170" width="16" height="190" fill="url(#barGradient)" opacity="0.85"/>
    <rect x="360" y="200" width="16" height="160" fill="url(#barGradient)" opacity="0.7"/>
    <rect x="390" y="180" width="16" height="180" fill="url(#barGradient)" opacity="0.8"/>
    <rect x="420" y="160" width="16" height="200" fill="url(#barGradient)" opacity="0.9"/>
  </g>

  <!-- Irregular waveform -->
  <path d="
        M80 260
        C110 210, 130 300, 160 255
        S210 200, 240 270
        S290 310, 320 250
        S360 190, 390 265
        S430 300, 460 255
        "
        fill="none"
        stroke="white"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"/>
  </svg>
