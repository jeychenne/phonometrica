<svg xmlns="http://www.w3.org/2000/svg" 
  width="24" height="24" viewBox="0 0 24 24" 
  fill="none" stroke="currentColor" 
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Left table -->
  <rect x="3" y="6" width="6" height="12" rx="1"/>
  <line x1="3" y1="10" x2="9" y2="10"/>
  <line x1="3" y1="14" x2="9" y2="14"/>

  <!-- Right table -->
  <rect x="15" y="6" width="6" height="12" rx="1"/>
  <line x1="15" y1="10" x2="21" y2="10"/>
  <line x1="15" y1="14" x2="21" y2="14"/>

  <!-- Merge arrows pointing inward -->
  <polyline points="11 9 9 12 11 15"/>
  <polyline points="13 9 15 12 13 15"/>

</svg>